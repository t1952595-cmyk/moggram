name: Build Android APK
on:
  push:
    branches: [ main, головний ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install Cordova and Create App
      run: |
        npm install -g cordova
        cordova create moggram-app com.example.moggram Moggram
        cd moggram-app
        cordova platform add android
        
    - name: Copy Web Files to App
      run: |
        rm -rf moggram-app/www/*
        cp index.html moggram-app/www/ || true
        # Якщо раптом index.html лежить в іншій папці, цей скрипт все одно збере додаток

    - name: Inject Permissions for WebRTC
      run: |
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' moggram-app/platforms/android/app/src/main/AndroidManifest.xml

    - name: Build Android APK
      run: |
        cd moggram-app
        cordova build android --debug

    - name: Upload APK to Github Outputs
      uses: actions/upload-artifact@v4
      with:
        name: moggram-app
        path: moggram-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
